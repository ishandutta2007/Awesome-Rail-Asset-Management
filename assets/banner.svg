<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background:#070b14;border-radius:12px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="50%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0b1a2e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.1"/>
    </linearGradient>
    
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes trackPulse {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.03); }
    }
    @keyframes trainDash {
      0% { transform: translateX(-150px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(1300px); opacity: 0; }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .track-line {
      stroke-dasharray: 20, 10;
      animation: trackPulse 12s linear infinite;
    }
    .pulse-element {
      animation: pulseGlow 4s ease-in-out infinite;
      transform-origin: center;
    }
    .train-light {
      animation: trainDash 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Background base -->
  <rect width="1200" height="340" fill="url(#bgGlow)"/>

  <!-- Geometric Grid Background -->
  <g stroke="#162544" stroke-width="1" opacity="0.4">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="800" y1="0" x2="800" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
  </g>

  <!-- Rail Network Lines / Perspective Tracks -->
  <g opacity="0.6">
    <!-- Main High-speed rail corridor -->
    <path d="M-50 280 L400 240 L800 240 L1250 280" fill="none" stroke="#00f2fe" stroke-width="2" class="track-line"/>
    <path d="M-50 295 L400 255 L800 255 L1250 295" fill="none" stroke="#00f2fe" stroke-width="4" filter="url(#softGlow)"/>
    <path d="M-50 310 L400 270 L800 270 L1250 310" fill="none" stroke="#38ef7d" stroke-width="2" opacity="0.5" class="track-line"/>
    
    <!-- Railway Sleepers / Ties -->
    <line x1="150" y1="270" x2="160" y2="305" stroke="#4facfe" stroke-width="2" opacity="0.4"/>
    <line x1="250" y1="260" x2="260" y2="295" stroke="#4facfe" stroke-width="2" opacity="0.4"/>
    <line x1="350" y1="250" x2="360" y2="285" stroke="#4facfe" stroke-width="2" opacity="0.4"/>
    <line x1="450" y1="245" x2="455" y2="275" stroke="#4facfe" stroke-width="2" opacity="0.4"/>
    <line x1="550" y1="245" x2="555" y2="275" stroke="#4facfe" stroke-width="2" opacity="0.4"/>
    <line x1="650" y1="245" x2="655" y2="275" stroke="#4facfe" stroke-width="2" opacity="0.4"/>
    <line x1="750" y1="245" x2="755" y2="275" stroke="#4facfe" stroke-width="2" opacity="0.4"/>
    <line x1="850" y1="250" x2="840" y2="285" stroke="#4facfe" stroke-width="2" opacity="0.4"/>
    <line x1="950" y1="260" x2="940" y2="295" stroke="#4facfe" stroke-width="2" opacity="0.4"/>
    <line x1="1050" y1="270" x2="1040" y2="305" stroke="#4facfe" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Dynamic Bullet Train Signal Beam -->
  <g class="train-light">
    <ellipse cx="0" cy="254" rx="90" ry="12" fill="#00f2fe" opacity="0.6" filter="url(#neonGlow)" />
    <circle cx="0" cy="254" r="8" fill="#ffffff" filter="url(#neonGlow)" />
    <line x1="-120" y1="254" x2="0" y2="254" stroke="#ffffff" stroke-width="3" opacity="0.9" />
  </g>

  <!-- Glowing Ambient Circles / Stations -->
  <circle cx="200" cy="80" r="140" fill="#00f2fe" opacity="0.04" filter="url(#neonGlow)"/>
  <circle cx="1020" cy="140" r="180" fill="#7928ca" opacity="0.06" filter="url(#neonGlow)"/>

  <!-- Main Content Area -->
  <g transform="translate(80, 55)">
    <!-- Category Pill -->
    <g>
      <rect x="0" y="0" width="260" height="28" rx="14" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-width="1.2"/>
      <circle cx="14" cy="14" r="5" fill="#00f2fe" class="pulse-element"/>
      <text x="28" y="19" fill="#00f2fe" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE RAIL ASSETS &amp; CBM</text>
    </g>

    <!-- Header Title -->
    <text x="0" y="72" fill="#ffffff" font-size="38" font-weight="900" letter-spacing="-0.5">
      Awesome Rail Asset Management <tspan fill="url(#cyanGrad)">⚡</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="106" fill="#94a3b8" font-size="16" font-weight="500">
      The Curated Ecosystem for Railway EAM, Rolling Stock Diagnostics, Track Health &amp; CBM
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 132)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="148" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="12" y="17" fill="#cbd5e1" font-size="12" font-weight="600">🚅 Rolling Stock APM</text>

      <!-- Tag 2 -->
      <rect x="158" y="0" width="146" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="170" y="17" fill="#cbd5e1" font-size="12" font-weight="600">🛤️ Linear Asset Track</text>

      <!-- Tag 3 -->
      <rect x="314" y="0" width="158" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="326" y="17" fill="#cbd5e1" font-size="12" font-weight="600">📡 IoT Condition Based</text>

      <!-- Tag 4 -->
      <rect x="482" y="0" width="134" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="494" y="17" fill="#cbd5e1" font-size="12" font-weight="600">📊 Enterprise CMMS</text>

      <!-- Tag 5 -->
      <rect x="626" y="0" width="144" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="638" y="17" fill="#cbd5e1" font-size="12" font-weight="600">🔓 Open-Source Repos</text>
    </g>
  </g>

  <!-- Right Decorative Modern Train Graphic / Radar -->
  <g transform="translate(1000, 150)" opacity="0.85">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#4facfe" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="28" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#00f2fe" class="pulse-element"/>
    
    <!-- Locomotive icon path -->
    <path d="M-18 -12 L18 -12 L22 10 L18 16 L-18 16 L-22 10 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="-10" cy="18" r="4" fill="#00f2fe"/>
    <circle cx="10" cy="18" r="4" fill="#00f2fe"/>
    <line x1="-10" y1="-4" x2="10" y2="-4" stroke="#00f2fe" stroke-width="2"/>
  </g>
</svg>